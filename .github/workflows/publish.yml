name: Publish to Comfy Registry

# 触发方式：
#   1) 改 pyproject.toml 里的 version 并推到 main（官方推荐，一次版本一次发布）
#   2) 手动 Run workflow
# 没加「创建 Release 时触发」：那样同一次改版本会被发布两遍，第二次会因版本已存在而报错。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    # fork 出去的仓库不会误触发发布
    if: ${{ github.repository_owner == 'Yumu2497' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # 版本号有两处：pyproject.toml（Registry 读这个）和 MOSS_Version.py（节点标题栏读这个）。
      # 不一致就发一个「页面上写 1.7.0、插件里显示 1.6.x」的版本出去，所以这里先拦。
      - name: Check version consistency
        shell: python
        run: |
          import os, re, sys, tomllib

          root = os.getcwd()
          with open(os.path.join(root, "pyproject.toml"), "rb") as f:
              v_pyproject = tomllib.load(f)["project"]["version"]

          src = open(os.path.join(root, "MOSS_Version.py"), encoding="utf-8").read()
          m = re.search(r'__version__\s*=\s*"([^"]+)"', src)
          v_module = m.group(1) if m else ""

          print(f"pyproject.toml  : {v_pyproject}")
          print(f"MOSS_Version.py : {v_module}")
          if v_pyproject != v_module:
              sys.exit(
                  f"版本号不一致：pyproject.toml={v_pyproject}，MOSS_Version.py={v_module}。"
                  "两处改成同一个再推送。"
              )

      - name: Check registry token
        run: |
          if [ -z "${{ secrets.REGISTRY_ACCESS_TOKEN }}" ]; then
            echo "::error::缺少仓库密钥 REGISTRY_ACCESS_TOKEN。Settings → Secrets and variables → Actions → New repository secret，值是 registry.comfy.org 上该 publisher 的 API Key。"
            exit 1
          fi

      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
